<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Garuda Cleaning Services | Gallery</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Overlock:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
body,html{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family: 'Overlock', cursive;
    background:#ffffff;
} 

/* Header */
.gallery-header{
    text-align:center;
    padding:60px 20px 30px;
    background:#022351;
    color:#fff;
}

.gallery-header h1{
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;
}

.gallery-header p{
    font-size:16px;
    opacity:0.9;
}

/* Gallery Container */
.gallery-container{
    max-width:1400px;
    margin:50px auto;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:25px;
}

/* Gallery Item */
.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:18px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.gallery-item img{
    width:100%;
    height:280px;
    object-fit:cover;
    transition:0.5s ease;
}

/* Hover Zoom */
.gallery-item:hover img{
    transform:scale(1.1);
}

/* Overlay */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(2,35,81,0.65);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
    opacity:0;
    transition:0.4s ease;
    backdrop-filter: blur(2px);
}

.gallery-item:hover .overlay{
    opacity:1;
}

/* ================= LIGHTBOX ================= */

/* Lightbox background */
.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

/* Lightbox modal box */
.lightbox-content{
    background:#fff;
    padding:15px;
    border-radius:12px;
    max-width:80%;
    max-height:80%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 50px rgba(0,0,0,0.4);
    animation: zoomIn 0.4s ease;
}

.lightbox-content img{
    max-width:100%;
    max-height:70vh;
    border-radius:10px;
}

/* Close Button */
.close-btn{
    position:absolute;
    top:30px;
    right:40px;
    font-size:40px;
    color:#fff;
    cursor:pointer;
    font-weight:300;
}

/* Navigation Buttons */
.nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    font-size:40px;
    padding:10px 18px;
    cursor:pointer;
    border-radius:50%;
    transition:0.3s;
}

.nav-btn:hover{
    background:rgba(255,255,255,0.35);
}

.prev{ left:40px; }
.next{ right:40px; }

/* Animation */
@keyframes zoomIn{
    from{ transform:scale(0.7); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

/* Responsive */
@media(max-width:1024px){
    .gallery-container{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media(max-width:600px){
    .gallery-container{
        grid-template-columns:1fr;
    }

    .gallery-header h1{
        font-size:28px;
    }

    .gallery-item img{
        height:220px;
    }

    .lightbox-content{
        max-width:95%;
        max-height:90%;
    }

    .nav-btn{
        font-size:30px;
        padding:8px 14px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="gallery-header">
  <h1>Sri Garuda Cleaning Services</h1>
  <p>Professional Cleaning Projects Gallery</p>
</div>
<!-- gallery -->
<div class="gallery-container">

  <div class="gallery-item">
    <img data-src="image/g1.jpg" class="lazy" loading="lazy" decoding="async" alt="Cleaning Service Project 1">
    <!-- <div class="overlay">View</div> -->
  </div>

  <div class="gallery-item">
    <img data-src="image/g2.jpg" class="lazy" loading="lazy" decoding="async" alt="Professional Cleaning Work 2">
    <!-- <div class="overlay">View</div> -->
  </div>

  <div class="gallery-item">
    <img data-src="image/g3.jpg" class="lazy" loading="lazy" decoding="async" alt="Commercial Cleaning Service 3">
    <!-- <div class="overlay"></div> -->
  </div>

  <div class="gallery-item">
    <img data-src="image/g4.jpg" class="lazy" loading="lazy" decoding="async" alt="Residential Cleaning Project 4">
    <!-- <div class="overlay">View</div> -->
  </div>

  <div class="gallery-item">
    <img data-src="image/g5.jpg" class="lazy" loading="lazy" decoding="async" alt="Deep Cleaning Service 5">
    <!-- <div class="overlay">View</div> -->
  </div>

  <div class="gallery-item">
    <img data-src="image/g6.jpg" class="lazy" loading="lazy" decoding="async" alt="Sanitization Service Project 6">
    <!-- <div class="overlay"></div> -->
  </div>

</div>


<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close-btn" onclick="closeLightbox()">&times;</span>

  <button class="nav-btn prev" onclick="prevImage()">&#10094;</button>

  <div class="lightbox-content">
      <img id="lightbox-img" src="">
  </div>

  <button class="nav-btn next" onclick="nextImage()">&#10095;</button>
</div>
<script>
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const galleryImages = document.querySelectorAll('.gallery-item img');

let currentIndex = 0;

/* ========== Lazy Load ========== */
const lazyImages = document.querySelectorAll('img.lazy');

const observer = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      const img = entry.target;
      img.src = img.dataset.src;   // load image
      img.classList.remove('lazy');
      observer.unobserve(img);
    }
  });
},{ threshold:0.1 });

lazyImages.forEach(img => observer.observe(img));

/* ========== Click Event (DIRECT BINDING) ========== */
galleryImages.forEach((img, index) => {
  img.addEventListener('click', () => {

    // If still lazy, force load
    if(!img.src){
      img.src = img.dataset.src;
    }

    currentIndex = index;
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

/* ========== Navigation ========== */
function nextImage(){
  currentIndex = (currentIndex + 1) % galleryImages.length;
  openImage();
}

function prevImage(){
  currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
  openImage();
}

function openImage(){
  const img = galleryImages[currentIndex];

  if(!img.src){
    img.src = img.dataset.src;
  }

  lightboxImg.src = img.src;
}

/* ========== Close ========== */
function closeLightbox(){
  lightbox.style.display = 'none';
}

/* ========== Keyboard Support ========== */
document.addEventListener('keydown', (e)=>{
  if(lightbox.style.display === 'flex'){
    if(e.key === 'ArrowRight') nextImage();
    if(e.key === 'ArrowLeft') prevImage();
    if(e.key === 'Escape') closeLightbox();
  }
});
</script>



</body>
</html>
